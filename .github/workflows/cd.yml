# ──────────────────────────────────────────────────
# CD — Continuous Deployment to AWS EC2
# Builds Docker images, pushes to GHCR, then deploys
# to EC2 via SSH using docker compose.
#
# Prerequisites on the EC2 instance:
#   - Docker & Docker Compose installed
#   - Repository cloned at ~/Task-Management-App
#   - Security group allows inbound on port 80 (and 443 for HTTPS)
#
# Required GitHub Secrets:
#   EC2_HOST       — Public IP or DNS of the EC2 instance
#   EC2_USERNAME   — SSH user (e.g. ubuntu, ec2-user)
#   EC2_SSH_KEY    — Private SSH key (PEM contents)
#   MONGODB_URI    — MongoDB connection string
#   JWT_SECRET     — Secret key for signing JWT tokens
#   JWT_EXPIRES_IN — JWT expiration (e.g. 7d) [optional, defaults to 7d]
#   SMTP_HOST      — SMTP server hostname [optional]
#   SMTP_PORT      — SMTP server port [optional]
#   SMTP_USER      — SMTP username [optional]
#   SMTP_PASS      — SMTP password [optional]
#
# No registry secrets needed — GHCR uses the automatic GITHUB_TOKEN.
# ──────────────────────────────────────────────────

name: CD

on:
  # Auto-deploy when CI passes on main
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Only one deploy at a time
concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/tharinrj/taskboard-backend
  FRONTEND_IMAGE: ghcr.io/tharinrj/taskboard-frontend

jobs:
  # ───── Gate: only deploy if CI succeeded ───────
  check-ci:
    name: Verify CI status
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "✅ CI passed — proceeding with deployment"

  # ───── Build & Push Docker Images to GHCR ──────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: check-ci
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract commit SHA (short)
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha_short }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───── Deploy to EC2 ───────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Write .env file to EC2
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << ENVSCRIPT
          cat > ~/Task-Management-App/backend/.env << 'EOF'
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN || '7d' }}
          PORT=5000
          FRONTEND_URL=http://frontend:3000
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          EOF
          chmod 600 ~/Task-Management-App/backend/.env
          ENVSCRIPT

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'DEPLOY_SCRIPT'

          set -e

          DEPLOY_DIR=~/Task-Management-App
          cd "$DEPLOY_DIR"

          echo "══════════════════════════════════════"
          echo "  📥 Pulling latest code"
          echo "══════════════════════════════════════"
          git fetch origin main
          git reset --hard origin/main

          echo ""
          echo "══════════════════════════════════════"
          echo "  🐳 Pulling latest Docker images"
          echo "══════════════════════════════════════"
          docker compose pull

          echo ""
          echo "══════════════════════════════════════"
          echo "  🚀 Starting services"
          echo "══════════════════════════════════════"
          docker compose up -d --remove-orphans

          echo ""
          echo "══════════════════════════════════════"
          echo "  🧹 Cleaning up old images"
          echo "══════════════════════════════════════"
          docker image prune -f

          echo ""
          echo "══════════════════════════════════════"
          echo "  ✅ Deployment complete!"
          echo "══════════════════════════════════════"
          docker compose ps

          DEPLOY_SCRIPT

      - name: Health check
        run: |
          echo "Waiting for services to start..."
          sleep 15
          STATUS=$(ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "curl -s -o /dev/null -w '%{http_code}' http://localhost/api/health || echo '000'") || true
          if [ "$STATUS" = "200" ]; then
            echo "✅ Backend is healthy (HTTP 200)"
          else
            echo "⚠️  Backend returned HTTP $STATUS — check with: docker compose logs"
          fi
        continue-on-error: true

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key

